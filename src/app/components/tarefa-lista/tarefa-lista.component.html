<div class="container">
  <h1>Gerenciador de Tarefas</h1>

  <a routerLink="/tarefas/nova">Nova Tarefa</a>

  <table>
    <thead>
      <tr>
        <th>Título</th>
        <th>Descrição</th>
        <th>Status</th>
        <th>Data de Criação</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tarefa of tarefas">
        <td>{{ tarefa.titulo }}</td>
        <td>{{ tarefa.descricao }}</td>
        <td>{{ tarefa.status }}</td>
        <td>{{ tarefa.dataCriacao | date:'dd/MM/yyyy' }}</td>
        <td>
          <a [routerLink]="['/tarefas/editar', tarefa.id]">Editar</a>
          <button (click)="excluir(tarefa.id!)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="tarefas.length === 0">Nenhuma tarefa cadastrada.</p>
</div>
